version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - ./backup:/var/opt/mssql/backup

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karma-api
    ports:
      - "5000:5100"
    depends_on:
      - db