services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - ./backup:/var/opt/mssql/backup
      - sql_data:/var/opt/mssql
    command: /bin/bash -c "/opt/mssql/bin/sqlservr & /bin/bash /var/opt/mssql/backup/init.sh"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karma-api
    ports:
      - "5000:5100"
    depends_on:
      - db
            
volumes:
  sql_data:
 
